<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMBOR — Ombor boshqaruv dasturi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Inter,sans-serif}
:root{--b:#1d4ed8;--b2:#3b82f6;--ok:#16a34a;--w:#d97706;--r:#dc2626;--ink:#0f172a;--mut:#64748b;--ln:#e2e8f0;--bg:#f1f5f9}
body{background:var(--bg);color:var(--ink)}
.top{background:linear-gradient(120deg,#0f172a,#1e3a8a);color:#fff;padding:0;position:sticky;top:0;z-index:50;box-shadow:0 3px 14px rgba(0,0,0,.18)}
.wrap{max-width:1400px;margin:0 auto;padding:0 14px}
.trow{display:flex;align-items:center;gap:14px;height:56px}
.logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo i{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-style:normal}
.who{font-size:12px;opacity:.85;text-align:right;line-height:1.3}
.bar{background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:56px;z-index:45}
.tabs{display:flex;gap:2px;overflow:auto;padding:0 0 0 0}
.tab{padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{color:var(--b)}
.tab.on{color:var(--b);border-bottom-color:var(--b);background:#f8fafc}
main{padding:16px 0 70px}
.pan{display:none}.pan.on{display:block}
.box{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
h3{font-size:15.5px;margin-bottom:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3 .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.k{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;border-left:4px solid var(--b)}
.k b{display:block;font-size:21px}
.k span{font-size:11.5px;color:var(--mut)}
.k.g{border-left-color:var(--ok)}.k.y{border-left-color:var(--w)}.k.r{border-left-color:var(--r)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.f.s2{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
label{font-size:11.5px;font-weight:600;color:var(--mut);display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;font-size:13.5px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--b2);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.btn{padding:8px 14px;border:none;border-radius:8px;background:var(--b);color:#fff;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.o{background:var(--ok)}.btn.w{background:var(--w)}.btn.r{background:var(--r)}.btn.d{background:#475569}
.btn.s{padding:5px 9px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:left;padding:8px;background:#f8fafc;border-bottom:2px solid var(--ln);font-size:11.5px;color:var(--mut);text-transform:uppercase;position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#fafcff}
.sc{max-height:520px;overflow:auto;border:1px solid var(--ln);border-radius:8px}
.t{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.t.g{background:#dcfce7;color:#15803d}.t.y{background:#fef9c3;color:#a16207}.t.r{background:#fee2e2;color:#b91c1c}
.t.b{background:#dbeafe;color:#1d4ed8}.t.s{background:#f1f5f9;color:#475569}
.low{color:var(--r);font-weight:700}
.mono{font-family:Consolas,monospace;font-size:12px}
.thumb{width:36px;height:36px;border-radius:7px;background:#f1f5f9;display:grid;place-items:center;overflow:hidden;font-size:17px;flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover}
.loc{border:1px solid var(--ln);border-radius:11px;padding:9px;background:#fff}
.loc h4{font-size:12.5px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.cells{display:grid;gap:4px}
.cell{border:1px solid var(--ln);border-radius:6px;padding:3px 4px;font-size:9.5px;min-height:46px;background:#f8fafc;position:relative}
.cell.bosh{background:#f1f5f9;border-style:dashed;color:#94a3b8}
.cell.normal{background:#dcfce7;border-color:#86efac}
.cell.kam{background:#fef9c3;border-color:#fde047}
.cell.full{background:#fee2e2;border-color:#fca5a5}
.cell b{display:block;font-size:9.5px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cl{position:absolute;top:1px;right:3px;font-size:8.5px;color:#64748b;font-weight:700}
.cell .q{font-weight:800;font-size:10px}
.bar2{height:4px;border-radius:2px;background:rgba(0,0,0,.1);margin-top:2px;overflow:hidden}
.bar2 div{height:100%}
#toast{position:fixed;top:70px;right:16px;z-index:99;display:flex;flex-direction:column;gap:7px}
.tst{background:var(--ink);color:#fff;padding:10px 15px;border-radius:9px;font-size:13px;max-width:380px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.login{max-width:370px;margin:100px auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}}
.picker{max-height:280px;overflow:auto;border:1px solid var(--ln);border-radius:8px;margin-top:6px}
.pick{display:flex;gap:8px;padding:7px;cursor:pointer;border-bottom:1px solid #f1f5f9;align-items:center}
.pick:hover{background:#eff6ff}
.doc{border:1px solid var(--ln);border-radius:10px;padding:12px;background:#fff;font-size:12.5px}
.sheet{border:1px solid #cbd5e1;border-radius:8px;padding:10px;margin:10px 0;background:#fff;break-inside:auto}
.sh-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid #0f172a;padding-bottom:5px;margin-bottom:8px;flex-wrap:wrap}
.sh-grid{display:grid;gap:5px}
.sh-cell{border:1px dashed #cbd5e1;border-radius:5px;padding:5px;font-size:11px;min-height:52px;background:#f8fafc}
.sh-cell.f{border-style:solid;border-color:#86efac;background:#f0fdf4}
.sh-cell .t{font-size:10px;font-weight:700;color:var(--mut);margin-bottom:2px}
.sh-cell .it{line-height:1.35}
/* ---------- 3D izometrik ombor ---------- */
.v3{position:relative;height:660px;border-radius:12px;overflow:hidden;cursor:grab;
  background:radial-gradient(120% 90% at 50% 8%,#f8fafc 0%,#e8edf3 55%,#dde4ec 100%);border:1px solid var(--ln);user-select:none}
.v3.drag{cursor:grabbing}
.v3 .world{position:absolute;left:50%;top:52%;width:0;height:0;transform-style:preserve-3d}
.v3 .bx,.v3 .pl,.v3 .lb{position:absolute;transform-style:preserve-3d;left:0;top:0;width:0;height:0}
.v3 .f{position:absolute;left:0;top:0;transform-origin:0 0}
.v3 .bx{cursor:pointer}
.v3 .bx:hover .f{filter:brightness(1.18)}
.v3 .bx.sel .f{outline:2px solid #2563eb;outline-offset:-2px}
.v3 .lb div{position:absolute;transform:rotateX(-90deg) rotateZ(0deg);background:#0f172a;color:#fff;font-size:13px;font-weight:700;
  padding:2px 7px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.v3 .fl-z{position:absolute;transform-style:preserve-3d;left:0;top:0;width:0;height:0}
.v3 .fl-z div{position:absolute;transform:rotateX(-90deg);font-size:112px;font-weight:900;color:rgba(15,23,42,.13);
  letter-spacing:4px;line-height:1;white-space:nowrap;text-shadow:0 2px 0 rgba(255,255,255,.5)}
.v3 .hint{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:#475569;background:rgba(255,255,255,.85);padding:4px 9px;border-radius:6px}
.v3 .side{position:absolute;right:12px;top:12px;width:290px;background:rgba(255,255,255,.95);border:1px solid var(--ln);border-radius:10px;padding:11px;font-size:12.5px;box-shadow:0 6px 22px rgba(15,23,42,.13);max-height:600px;overflow:auto}
.w3d-ctl{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.w3d-ctl label{display:flex;align-items:center;gap:5px;color:var(--mut)}
.w3d-ctl input[type=range]{width:105px}

/* --- 2D rejasi --- */
.v3 #w_plan{position:absolute;inset:0;overflow:auto;padding:12px 314px 64px 12px;
  background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);user-select:text}
.v3.m2d{cursor:default}
.v3 #w_plan .p-room{margin-bottom:13px;border:1px solid var(--ln);border-radius:10px;background:#fff;padding:10px}
.v3 #w_plan .p-rh{font-weight:800;font-size:14.5px;display:flex;gap:9px;align-items:baseline;margin-bottom:7px}
.v3 #w_plan .p-rh span{font-weight:400;font-size:11.5px;color:var(--mut)}
.v3 #w_plan .p-zone{margin-top:10px}
.v3 #w_plan .p-zh{font-weight:800;font-size:13px;border-left:6px solid;padding-left:8px;margin-bottom:7px;
  display:flex;gap:9px;align-items:baseline}
.v3 #w_plan .p-zh span{font-weight:400;color:var(--mut);font-size:11.5px}
.v3 #w_plan .p-racks{display:flex;gap:12px;flex-wrap:wrap}
.v3 #w_plan .p-rack{border:1px solid #cbd5e1;border-radius:8px;padding:7px;background:#f8fafc}
.v3 #w_plan .p-rn{font-size:12px;font-weight:800;margin-bottom:6px;display:flex;gap:6px;align-items:baseline}
.v3 #w_plan .p-rn span{font-weight:400;color:var(--mut);font-size:10.5px}
.v3 #w_plan .p-cells{display:grid;gap:3px}
.v3 .pcell{width:47px;height:39px;border-radius:5px;border:1px solid #cbd5e1;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;
  cursor:pointer;line-height:1.15;transition:filter .1s}
.v3 .pcell span{color:var(--mut)}
.v3 .pcell b{font-size:11.5px}
.v3 .pcell i{color:#94a3b8;font-style:normal}
.v3 .pcell.normal{background:#dcfce7;border-color:#86efac}
.v3 .pcell.kam{background:#fef9c3;border-color:#fde047}
.v3 .pcell.full{background:#fee2e2;border-color:#fca5a5}
.v3 .pcell.bosh{background:#f1f5f9;border-color:#e2e8f0}
.v3 .pcell:hover{filter:brightness(.95)}
.v3 .pcell.sel{outline:3px solid #2563eb;outline-offset:1px;box-shadow:0 0 0 3px rgba(37,99,235,.28)}
.v3 #w_plan .p-rh,.v3 #w_plan .p-zh,.v3 #w_plan .p-rn{cursor:pointer;border-radius:5px;transition:background .12s}
.v3 #w_plan .p-rh:hover,.v3 #w_plan .p-zh:hover,.v3 #w_plan .p-rn:hover{background:#e0e7ff}

@media print{.sheet{page-break-after:always;break-after:page}.sheet:last-child{page-break-after:auto;break-after:auto}
  .sh-cell{min-height:44px}.sheet{border-color:#94a3b8}.v3{display:none!important}}
@media print{
  body{background:#fff}
  .top,.bar,.noprint,#toast,#login{display:none!important}
  .pan{display:none!important}
  .pan.on{display:block!important}
  main{padding:0;max-width:none}
  .box{border:1px solid #cbd5e1;break-inside:avoid;page-break-inside:avoid}
  table{font-size:10.5px}th{background:#f1f5f9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cell,.t,.low,.sc>div{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  h3{break-after:avoid}
}
</style>
</head>
<body>

<div id="login" class="login box noprint">
  <h3>🔐 Ombor dasturiga kirish</h3>
  <label>Login</label><input id="lg" value="admin" style="margin-bottom:8px">
  <label>Parol</label><input id="pw" type="password" value="1234" style="margin-bottom:10px">
  <button class="btn" style="width:100%;padding:11px" onclick="sign()">Kirish</button>
  <p id="lerr" style="color:var(--r);font-size:13px;margin-top:8px"></p>
</div>

<div id="app" style="display:none">
<div class="top"><div class="wrap trow">
  <div class="logo" onclick="go('dash')"><i>🏭</i> OMBOR <span style="font-size:11px;opacity:.7;font-weight:500">Ombor boshqaruvi</span></div>
  <div class="bar" style="position:static;border:none;background:none;flex:1;overflow:hidden;padding:0"><input id="gsearch" placeholder="🔍 Shtrix skanerlash yoki nom/SKU/qidirish — Enter" onkeydown="if(event.key==='Enter')globalSearch(this.value)" style="max-width:420px"></div>
  <div class="who" id="who"></div>
  <button class="btn r s" onclick="logout()">Chiqish</button>
</div></div>
<div class="bar"><div class="wrap tabs" id="tabs"></div></div>
<main class="wrap">

<div class="pan on" id="dash"></div>
<div class="pan" id="items"></div>
<div class="pan" id="locs"></div>
<div class="pan" id="w3d"></div>
<div class="pan" id="stocks"></div>
<div class="pan" id="doc" data-type="kirish"></div>
<div class="pan" id="docs"></div>
<div class="pan" id="counts"></div>
<div class="pan" id="moves"></div>
<div class="pan" id="rep"></div>
<div class="pan" id="place"></div>
<div class="pan" id="sup"></div>
<div class="pan" id="print" style="display:none"></div>

</main>
</div>
<div id="toast"></div>

<script>
let T=localStorage.getItem('om_t')||'', ME={}, LOC=[], IT=[], STOCKS=[], SUP=[];
const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString('uz-UZ')+" so'm";
const num=n=>Number(n||0).toLocaleString('uz-UZ');
const dt=s=>s?s.slice(0,16).replace('T',' '):'';
function toast(t,ms=2800){const d=document.createElement('div');d.className='tst';d.textContent=t;$('toast').appendChild(d);setTimeout(()=>d.remove(),ms)}
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...(o.headers?o.headers:{'Authorization':'Bearer '+T})}});const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401){localStorage.removeItem('om_t');location.reload()}throw new Error(d.error||'Xatolik')}return d};

const TABS=[['dash','📊 Boshqaruv paneli'],['items','📦 Tovarlar'],['stocks','🏷️ Ombordagi tovarlar'],['locs','🏗️ Stelyajlar'],['w3d','🧊 Ombor rejasi'],['doc','📥 Yangi hujjat'],['docs','🗂️ Hujjatlar'],['counts','🧮 Inventarizatsiya'],['moves','🔄 Harakatlar'],['rep','📈 Hisobotlar'],['place','📍 Joylashuv ro\'yxati'],['sup','🚚 Yetkazib beruvchilar']];
let cur='dash';
function go(p){
  cur=p;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p===p));
  document.querySelectorAll('.pan').forEach(s=>s.classList.toggle('on',s.id===p));
  ({dash:loadDash,items:loadItems,stocks:loadStocks,locs:loadLocs,w3d:loadW3D,doc:()=>loadDoc($('dtype').value),docs:loadDocs,counts:loadCounts,moves:loadMoves,rep:loadRep,place:loadPlace,sup:loadSup})[p]();
}

async function sign(){
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('lg').value,pass:$('pw').value})});
    const d=await r.json(); if(!r.ok)throw new Error(d.error||'Xato');
    T=d.token;localStorage.setItem('om_t',T);boot(d.user);
  }catch(e){$('lerr').textContent=e.message}
}
function logout(){localStorage.removeItem('om_t');location.reload()}
async function boot(u){
  ME=u;$('login').style.display='none';$('app').style.display='block';
  $('who').innerHTML=`<b>${u.name}</b><br>${u.role}`;
  $('tabs').innerHTML=TABS.map(t=>`<div class="tab ${t[0]==='dash'?'on':''}" data-p="${t[0]}" onclick="go('${t[0]}')">${t[1]}</div>`).join('');
  await base();go('dash');
}
async function base(){LOC=await api('/api/locations');IT=(await api('/api/items')).items;SUP=await api('/api/suppliers')}

/* ---------- Dashboard ---------- */
async function loadDash(){
  const d=await api('/api/report/dashboard');
  const t=d.today||[];
  $('dash').innerHTML=`
  <div class="kpi">
    <div class="k"><b>${num(d.items)}</b><span>Tovarlar (dori turi)</span></div>
    <div class="k"><b>${num(d.locations)}</b><span>Stelyaj / joy</span></div>
    <div class="k g"><b>${num(d.total_qty)}</b><span>Ombordagi dona</span></div>
    <div class="k g"><b>${money(d.value)}</b><span>Ombor qiymati</span></div>
    <div class="k"><b>${num(d.positions)}</b><span>Band o'rin</span></div>
    <div class="k y"><b>${num(d.drafts)}</b><span>Qoralama hujjat</span></div>
    <div class="k g"><b>+${num(d.month_in)}</b><span>Bu oy kirim</span></div>
    <div class="k w"><b>−${num(d.month_out)}</b><span>Bu oy chiqim</span></div>
  </div>
  <div class="g2">
    <div class="box"><h3>📥 Bugungi hujjatlar</h3>
      ${t.length?`<table><tr><th>Turi</th><th>Soni</th><th>Dona</th></tr>${t.map(x=>`<tr><td>${({kirish:'Kirim',chiqim:'Chiqim','ko\'chirish':'Ko\'chirish','yo\'qotish':'Yo\'qotish',inventarizatsiya:'Inventarizatsiya'})[x.type]||x.type}</td><td>${x.c}</td><td>${num(x.q)}</td></tr>`).join('')}</table>`:'<p style="color:var(--mut)">Bugun hujjat yo\'q</p>'}
      <div class="r noprint" style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn o" onclick="newDoc('kirish')">+ Kirim</button>
        <button class="btn" onclick="newDoc('chiqim')">- Chiqim</button>
        <button class="btn w" onclick="newDoc('ko\'chirish')">⇄ Ko\'chirish</button>
        <button class="btn r" onclick="newDoc('yo\'qotish')">⚠ Yo\'qotish</button>
      </div>
    </div>
    <div class="box"><h3>⚠️ Minimal zaxiradan past</h3>
      ${d.low.length?`<div class="sc"><table><tr><th>Tovar</th><th>Kategoriya</th><th>Qoldi</th><th>Min</th></tr>${d.low.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.category}</td><td class="low">${num(x.qty)}</td><td>${num(x.min_stock)}</td></tr>`).join('')}</table></div>`:'<p style="color:var(--ok)">✓ Hammasi yetarli</p>'}
    </div>
  </div>
  <div class="g2">
    <div class="box"><h3>⏳ Muddatiga yaqin</h3>
      ${d.expiring.length?`<div class="sc"><table><tr><th>Tovar</th><th>Joy</th><th>Yaroqlilik</th><th>Soni</th></tr>${d.expiring.map(x=>`<tr><td>${x.item_name}</td><td>${x.loc_code}</td><td class="low">${x.expiry}</td><td>${num(x.qty)}</td></tr>`).join('')}</table></div>`:'<p style="color:var(--mut)">Muddatiga yaqin partiya yo\'q</p>'}
    </div>
    <div class="box"><h3>🗂️ Oxirgi hujjatlar</h3>
      <div class="sc"><table><tr><th>№</th><th>Turi</th><th>Sana</th><th>Holat</th><th>Qator</th></tr>${d.recent.map(x=>`<tr><td><a style="cursor:pointer;color:var(--b);font-weight:700" onclick="viewDoc(${x.id})">${x.no}</a></td><td>${({kirish:'Kirim',chiqim:'Chiqim','ko\'chirish':'Ko\'chirish','yo\'qotish':'Yo\'qotish',inventarizatsiya:'Inv.'})[x.type]||x.type}</td><td>${x.doc_date}</td><td>${statT(x.status)}</td><td>${x.lines_count}</td></tr>`).join('')}</table></div>
    </div>
  </div>`;
}
const statT=s=>`<span class="t ${s==='tasdiqlandi'?'g':s==='draft'?'y':'r'}">${({tasdiqlandi:'Tasdiqlandi',draft:'Qoralama','bekor qilindi':'Bekor'})[s]||s}</span>`;

/* ---------- Nomenklatura ---------- */
async function loadItems(){
  const d=await api('/api/items?q='+encodeURIComponent($('i_q')?.value||'')+'&cat='+encodeURIComponent($('i_cat')?.value||''));
  IT=d.items;
  $('items').innerHTML=`
  <div class="box"><h3>📦 Yangi tovar qo'shish</h3>
    <div class="f">
      <div><label>Nomi *</label><input id="n_name" placeholder="Paracetamol"></div>
      <div><label>Shakli</label><select id="n_form"><option>tabletka</option><option>kapsula</option><option>sirup</option><option>inyeksiya</option><option>maz</option><option>tomchi</option><option>quti</option></select></div>
      <div><label>Kategoriya</label><input id="n_cat" placeholder="og'riq qoldiruvchi" list="cats"></div>

async function csv(t){
  const d=await api('/api/export?t='+t);
  if(!d.length)return toast('Ma\'lumot yo\'q');
  const keys=Object.keys(d[0]);
  const csv='\uFEFF'+[keys.join(';')].concat(d.map(r=>keys.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(';'))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=t+'.csv';a.click();
}

const CW=44,CD=34,LH=30,SLAB=4,ZP=250,RP=78;
const CLR={bosh:['#e8edf3','#cfd8e3','#b6c2d1'],kam:['#fde68a','#f59e0b','#d97706'],normal:['#86efac','#22c55e','#15803d'],"to'liq":['#fca5a5','#ef4444','#b91c1c']};
const ZC={A:'#1d4ed8',B:'#047857',C:'#b45309',D:'#7c3aed',A2:'#0891b2',B2:'#0d9488',C2:'#ea580c',D2:'#9333ea'};
let V3={rx:56,rz:34,sc:.62,lx:0,lz:0,sel:null,first:null,zl:true,nl:true,zone:'A',rack:'',dz:false,dk:null,keys:0,M:null,mode:'2d'};
const RACKS=()=>V3.M?[...V3.M.locations].sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true})).map(l=>l.code):[];
function zorder(list){
  const f=new Map();
  (list||[]).forEach(l=>f.set(l.zone,Math.min(f.get(l.zone)===undefined?99:f.get(l.zone),l.floor||1)));
  return [...f.keys()].sort((a,b)=>(f.get(a)-f.get(b))||String(a).localeCompare(String(b)));
}
const ZONES=()=>V3.M?zorder(V3.M.locations):[];
const ROOMS=()=>V3.M?([...new Set(V3.M.locations.map(l=>(l.building||'Bino-1')+' / '+(l.room||'Xona-1')))].sort()):[];
function rackIdx(){return RACKS().indexOf(V3.rack)}
function zoneIdx(){return ZONES().indexOf(V3.zone)}
function stepZone(d){
  const Z=ZONES(); if(!Z.length)return;
  let i=(V3.zone?zoneIdx():Z.length)+d;
  if(i<0)i=Z.length-1; if(i>=Z.length)i=0;
  setZone(Z[i]);
}
function setRack(c){
  V3.rack=c||'';
  V3.sel=null;
  if(V3.rack){V3.zone='';V3.sc=V3.sc<1.2?2.0:V3.sc}
  else V3.sc=0.5;
  resetDrug(false);
  renderW3D();camFit();syncSliders();applyCam();syncRack();syncDrug();
  if(V3.rack)rackPanel(V3.rack); else if(V3.zone)zonePanel(V3.zone); else sideDefault();
}
function stepRack(d){
  const R=RACKS(); if(!R.length)return;
  let i=rackIdx()+d;
  if(i<0)i=R.length-1; if(i>=R.length)i=0;
  setRack(R[i]);
}
function drugList(){
  const m=V3.M; if(!m)return[];
  const locs=[...m.locations].sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}));
  const out=[];
  locs.forEach(l=>{
    if(!V3.dz){
      if(V3.rack){if(l.code!==V3.rack)return}
      else if(V3.zone){if(l.zone!==V3.zone)return}
    }
    l.cells.forEach(c=>{
      if(!c.stocks||!c.stocks.length)return;
      c.stocks.forEach(s=>{

function resetDrug(dz){

}
function toggleDrugAll(){

function stepDrug(k){
  const L=drugList(); if(!L.length)return;
  let i=L.findIndex(e=>e.key===V3.dk);
  i=(i<0?(k>0?-1:0):i)+k;
  i=((i%L.length)+L.length)%L.length;
  const e=L[i];
  V3.dk=e.key;
  if(V3.dz){V3.zone=e.zone;V3.rack='';V3.sc=0.62}
  V3.sel={loc:e.loc,r:e.r,c:e.c};
  renderW3D();camFit();syncSliders();applyCam();syncRack();syncDrug();markSel();
}
function syncDrug(){
  const L=drugList(), i=L.findIndex(e=>e.key===V3.dk);
  const w=$('w_drugn'), t=$('w_drugi'), b=$('w_dz');

  if(b){b.style.opacity=V3.dz?1:.55;b.style.boxShadow=V3.dz?'0 0 0 3px #7c3aed':'none'}

function cube3(x,y,z,W,D,H,c,loc,r,col,tip,op){

    style="transform:translate3d(${x}px,${y}px,${z}px);opacity:${op===undefined?1:op}">
    <div class="f" style="width:${W}px;height:${D}px;background:${t};transform:translateY(${-H}px) rotateX(-90deg)"></div>
    <div class="f" style="width:${W}px;height:${H}px;background:linear-gradient(180deg,${f},${s});transform:translateY(${-H}px)"></div>
    <div class="f" style="width:${D}px;height:${H}px;background:linear-gradient(90deg,${s},${t});transform:translate(${W}px,${-H}px) rotateY(90deg)"></div>
  </div>`;
}

    const dim=V3.zone&&z!==V3.zone;
    const op=dim?.13:1;

      out+=`<div class="pl" style="transform:translate3d(${-110}px,0px,${zW}px)">
        <div class="f" style="width:${cx+110-gap}px;height:64px;background:linear-gradient(180deg,#e2e8f0,#94a3b8);transform:translateY(-64px)"></div></div>`;
      out+=`<div class="pl" style="transform:translate3d(${cx+gap}px,0px,${zW}px)">

function roomInfo(k){

  const ls=V3.M.locations.filter(l=>roomKey(l)===k);
  if(!ls.length)return;
  const zs=zorder(ls), items=locItems(ls), f=ls[0].floor||1;
  sideSet(sideHead('&#127970; '+k,'qavat '+f+' &middot; '+ls.length+' stelyaj &middot; '+zs.length+' zona &middot; '+num(locQty(ls))+' dona','sideDefault()')

   +`<div style="display:flex;gap:5px;flex-wrap:wrap">${ls.map(l=>`<button class="btn s" onclick="rackInfo('${l.code}')" title="${l.name||''}">&#128230; ${l.code}<span style="opacity:.65;font-weight:400"> ${num(l.total_qty)}</span></button>`).join('')}</div>`
   +sideItems(items)

}
function zonePanel(z){
  if(!V3.M)return;
  const ls=V3.M.locations.filter(l=>l.zone===z);
  if(!ls.length)return;
  const items=locItems(ls), f=ls[0].floor||1;
  sideSet(sideHead('&#128193; '+z+'-zona',(ls[0]?roomKey(ls[0]):'')+' &middot; qavat '+f+' &middot; '+ls.length+' stelyaj &middot; '+num(locQty(ls))+' dona','sideDefault()')
   +sideChips([[ZC[z]?'&#9679; '+z:''],[ls.length+' stelyaj'],[num(locQty(ls))+' dona'],[(ls||[]).reduce((a,l)=>a+(l.used_cells||0),0)+' katak band']])
   +`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${ls.map(l=>`<button class="btn s" onclick="rackInfo('${l.code}')" title="${l.name||''}">&#128230; ${l.code}<span style="opacity:.65;font-weight:400"> ${num(l.total_qty)}</span></button>`).join('')}</div>`
   +sideItems(items)

}
function rackPanel(c){
  if(!V3.M)return;
  const l=V3.M.locations.find(x=>x.code===c);
  if(!l)return;
  const all=(l.cells||[]), filled=all.filter(x=>x.qty>0);
  sideSet(sideHead('&#128230; '+l.code,(l.name||'')+' &middot; '+l.zone+'-zona &middot; '+roomKey(l)+' &middot; qavat '+(l.floor||1),'sideDefault()')
   +sideChips([[(l.rows||1)+'&#215;'+(l.cols||1)+' katak'],[filled.length+'/'+all.length+' band'],[num(l.total_qty)+' dona'],[l.kind==='zona'?'butun zona':'stelyaj']])
   +`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">

      <button class="btn s" onclick="roomInfo('${roomKey(l)}')">&#127970; Xona</button></div>`
   +(filled.length?`<div style="font-size:12px;color:var(--mut);margin:10px 0 4px">Band kataklar:</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">${filled.map(x=>`<button class="btn s" onclick="pick3('${l.code}',${x.row},${x.col})" title="${x.stocks.map(s2=>s2.item_name).join(', ')}">&#9632; ${x.name}<span style="opacity:.65;font-weight:400"> ${num(x.qty)}</span></button>`).join('')}</div>`
     :`<div style="color:var(--mut);padding:9px 0">Bu stelyaj bo'sh &mdash; katak band emas.</div>`)
   +`<div style="border-top:1px solid var(--ln);margin-top:9px;padding-top:8px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn s" onclick="sideDefault()">&#9664; Yopish</button>
      <button class="btn s" onclick="go('locs');setTimeout(()=>toast('${l.code}'),200)">&#128203; Stelyaj varaqasi</button></div>`);
}

function w3dView(v){
  if(v==='iso'){V3.rx=56;V3.rz=34}
  if(v==='top'){V3.rx=88;V3.rz=0}
  if(v==='front'){V3.rx=12;V3.rz=0}
  if(v==='side'){V3.rx=16;V3.rz=74}
  V3.sc=V3.rack?2.0:V3.zone?0.62:0.50;
  camFit();syncSliders();applyCam();
}
function camFit(){
  const B=V3.b; if(!B)return;
  const cx=B.fx/2, cz=B.cz!==undefined?B.cz:B.nz*ZP/2;
  const a=V3.rx*Math.PI/180,b=V3.rz*Math.PI/180,s=V3.sc;
  const cy=-45;
  const y1=cx*Math.sin(b)+cy*Math.cos(b), x1=cx*Math.cos(b)-cy*Math.sin(b);
  const y2=y1*Math.cos(a)-cz*Math.sin(a);
  V3.lx=Math.round(-s*x1); V3.lz=Math.round(-s*y2);
}

    V3.sc=Math.max(.25,Math.min(1.4,V3.sc*(e.deltaY<0?1.1:.9)));applyCam();
  };
  let down=false,moved=false,px=0,py=0;
  v.onpointerdown=e=>{
    down=true;moved=false;px=e.clientX;py=e.clientY;

  };
  v.onpointermove=e=>{
    if(!down||V3.mode==='2d')return;
    const dx=e.clientX-px, dy=e.clientY-py;
    if(!moved&&Math.abs(dx)+Math.abs(dy)<5)return;
    moved=true;
    V3.rz+=dx*.35;
    V3.rx=Math.max(5,Math.min(89,V3.rx-dy*.25));
    px=e.clientX;py=e.clientY;

    if(!down)return;

    if(!e.target.closest||!e.target.closest('.bx,.pl,.pcell,#w_side')){V3.sel=null;markSel()}
  };
  v.onpointerup=up;
  v.onpointercancel=()=>{down=false;moved=false;v.classList.remove('drag')};
  v.onpointerleave=()=>{down=false;v.classList.remove('drag')};

    });
  }

}

  if(r[3])r[3].value=V3.lx;
  if(r[4])r[4].value=V3.lz;
}

  const f='&loc='+encodeURIComponent($('pl_loc')?.value||'')+'&cat='+encodeURIComponent($('pl_cat')?.value||'')+'&q='+encodeURIComponent($('pl_q')?.value||'');
  const d=await api('/api/report/placement?'+f);
  const a=[['Zona','Stelyaj','Katak','SKU kodi','Dori nomi','Shtrix','Kategoriya','Birlik','Soni','Partiya','Yaroqlilik','Min zaxira','Qiymat']];
  d.items.forEach(it=>it.positions.forEach(p=>a.push([p.zone,p.loc,p.cell,p.code,it.name,it.barcode,it.category,it.unit,p.qty,p.batch_no||'',p.expiry||'',it.min_stock,(p.qty*it.cost).toFixed(2)])));
  dl('Joylashuv_royxati_'+new Date().toISOString().slice(0,10)+'.csv',a);
}

async function loadSup(){
  $('sup').innerHTML=`<div class="box"><h3>🚚 Yangi yetkazib beruvchi</h3>
    <div class="f"><div><label>Nomi *</label><input id="s_n"></div><div><label>Telefon</label><input id="s_p"></div>

async function addSup(){try{await api('/api/suppliers',{method:'POST',body:JSON.stringify({name:$('s_n').value,phone:$('s_p').value,address:$('s_a').value})});toast('✅');SUP=await api('/api/suppliers');loadSup()}catch(e){toast('❌ '+e.message)}}
async function delSup(id){if(!confirm('O\'chirilsinmi?'))return;try{await api('/api/suppliers/'+id,{method:'DELETE'});SUP=await api('/api/suppliers');loadSup()}catch(e){toast('❌ '+e.message)}}
